<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRINITY SYSTEM</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Courier New;
}

/* écran principal */

#overlay{
    position:fixed;
    inset:0;
    background:black;
    color:red;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    animation:shake 0.08s infinite;
}

h1{
    font-size:70px;
    text-shadow:0 0 20px red;
}

#barContainer{
    width:70%;
    height:40px;
    border:2px solid red;
    margin-top:30px;
    overflow:hidden;
    box-shadow:0 0 20px red;
}

#bar{
    width:0%;
    height:100%;
    background:lime;
    box-shadow:0 0 20px lime;
}

#percent{
    color:lime;
    font-size:50px;
    margin-top:15px;
}

#status{
    color:white;
    font-size:25px;
    margin-top:25px;
}

/* fausses fenêtres */

.fake{
    position:fixed;
    width:330px;
    padding:20px;
    background:black;
    border:3px solid red;
    box-shadow:0 0 25px red;
    color:red;
    font-size:22px;
    z-index:999999;
    animation:shake 0.08s infinite;
}

/* animations */

@keyframes shake{

    0%{transform:translate(2px,2px);}
    25%{transform:translate(-2px,1px);}
    50%{transform:translate(2px,-2px);}
    75%{transform:translate(-1px,2px);}
    100%{transform:translate(2px,1px);}

}

</style>
</head>

<body>

<div id="overlay">

    <h1>⚠ SYSTEM BREACH ⚠</h1>

    <p style="color:white;font-size:24px;">
        Analyse du système...
    </p>

    <div id="barContainer">
        <div id="bar"></div>
    </div>

    <p id="percent">0%</p>

    <p id="status">
        Initialisation...
    </p>

</div>

<script>

/* éléments */

const bar = document.getElementById("bar");
const percent = document.getElementById("percent");
const status = document.getElementById("status");

/* messages */

const messages = [

    "Connexion au satellite...",
    "SYSTEME CORROMPU",
    "VOUS ÊTES ATTAQUÉ",
    "Analyse mémoire...",
    "Adresse IP détectée...",
    "TRINITY ACCESS...",
    "Téléchargement des données...",
    "Caméra activée...",
    "Injection système..."

];

/* popup */

function popup(text){

    const div = document.createElement("div");

    div.className = "fake";

    div.style.top =
        Math.random()*80 + "%";

    div.style.left =
        Math.random()*80 + "%";

    div.innerHTML = `

        <h2 style="
            margin:0;
            color:red;
        ">
            ⚠ ALERTE ⚠
        </h2>

        <p style="
            color:white;
            margin-top:15px;
        ">
            ${text}
        </p>

    `;

    document.body.appendChild(div);

    navigator.vibrate?.([200,100,200]);

    setTimeout(()=>{

        div.remove();

    },5000);

}

/* beaucoup de fenêtres */

function chaos(){

    for(let i=0;i<35;i++){

        setTimeout(()=>{

            popup(

                messages[
                    Math.floor(
                        Math.random()*messages.length
                    )
                ]

            );

        },i*250);

    }

    /* satellite après 5 sec */

    setTimeout(()=>{

        popup(
            "Connexion aux satellites TRINITY..."
        );

    },5000);

    /* spam intense */

    const spam = setInterval(()=>{

        popup(

            messages[
                Math.floor(
                    Math.random()*messages.length
                )
            ]

        );

    },180);

    /* fermeture après 10 sec */

    setTimeout(()=>{

        clearInterval(spam);

        document
        .querySelectorAll(".fake")
        .forEach(el=>el.remove());

        status.innerText =
            "Système silencieux...";

    },10000);

}

chaos();

/* progression */

let i = 0;

const infect = setInterval(()=>{

    i++;

    bar.style.width = i + "%";

    percent.innerText =
        i + "%";

    status.innerText =

        messages[
            Math.floor(
                Math.random()*messages.length
            )
        ];

    /* popup régulière */

    if(i % 8 === 0){

        popup(

            messages[
                Math.floor(
                    Math.random()*messages.length
                )
            ]

        );

    }

    /* fin */

    if(i >= 100){

        clearInterval(infect);

        setTimeout(()=>{

            document
            .getElementById("overlay")
            .innerHTML = `

                <h1 style="
                    color:red;
                    font-size:75px;
                    text-shadow:
                    0 0 25px red;
                ">
                    ☠ SYSTEM LOCKED ☠
                </h1>

                <p style="
                    color:white;
                    font-size:35px;
                ">
                    Connexion TRINITY établie
                </p>

                <p style="
                    color:lime;
                    font-size:45px;
                    text-shadow:
                    0 0 25px lime;
                ">
                    DONNÉES TRANSFÉRÉES
                </p>

            `;

        },1000);

    }

},120);

/* si utilisateur clique */

let already = false;

document.body.addEventListener("click",()=>{

    if(!already){

        already = true;

        popup(
            "SYSTEME DÉJÀ INFECTÉ — DONNÉES TRANSFÉRÉES"
        );

    }

});

/* =========================
   SI UTILISATEUR REVIENT
========================= */

if(localStorage.getItem("infected") === "yes"){

    setTimeout(()=>{

        popup(
            "SYSTEME INFECTÉ"
        );

    },1000);

    /* ferme la fenêtre après 5 sec */

    setTimeout(()=>{

        document.body.innerHTML = "";

        window.open("","_self");

        window.close();

    },5000);

}

/* sauvegarde */

localStorage.setItem(
    "infected",
    "yes"
);

</script>

</body>
</html>
